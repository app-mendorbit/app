<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendorbit Security | Redirecting...</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script>
    // Seamless redirect to unified Mendorbit index.html portal preserving all parameters
    (function() {
      const search = window.location.search || "";
      let target = "index.html";
      if (search) {
        if (!search.includes("action=lock")) {
          target += search + "&action=lock";
        } else {
          target += search;
        }
      } else {
        target += "?action=lock";
      }
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #fff7ed 0%, #fef2f2 35%, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #0f172a;
    }
    .loader-box {
      background: #ffffff;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(255, 94, 0, 0.08);
      text-align: center;
      max-width: 360px;
      border: 1px solid #fed7aa;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #fed7aa;
      border-top-color: #ff5e00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h3 style="margin: 0 0 6px 0; font-size: 16px; font-weight: 800; color: #ff5e00;">Mendorbit Security</h3>
    <p style="margin: 0; font-size: 13px; color: #64748b;">Redirecting to unified authentication portal...</p>
  </div>
</body>
</html>
